name: supernatural-expert

services:
  db:
    # Carries pg_search for BM25 ranking and pgvector for embeddings, so one
    # database answers both search paths and there is nothing to keep in step.
    image: paradedb/paradedb:0.25.1-pg18
    container_name: supernatural-expert-db
    restart: unless-stopped
    # pg_search loads at startup or not at all, and a cluster keeps whatever
    # configuration file it was initialised with, which need not name it. Setting
    # the list here settles that either way. It is the image's own default list:
    # dropping pg_cron leaves the image's bootstrap unable to create it.
    command: postgres -c shared_preload_libraries=pg_search,pg_cron,pg_stat_statements
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container, bound to the loopback so the database is not exposed on
      # the local network. The host port avoids 5432 because other projects on
      # this machine already publish PostgreSQL there.
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      # PostgreSQL 18 images expect one mount here and place the cluster in a
      # major-version subdirectory. Mounting /var/lib/postgresql/data fails.
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    # The 64 MB default is small once queries run in parallel.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    # The chat, the agent, the search index, and the two ONNX models. See
    # docker/Dockerfile for what is baked in and why.
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: supernatural-expert-app
    restart: unless-stopped
    depends_on:
      db:
        # The first start loads the corpus, so the database has to be answering
        # queries and not merely running.
        condition: service_healthy
    ports:
      # Loopback for the same reason the database is: this is a local
      # application, and nothing here expects a visitor from the network.
      - "127.0.0.1:${STREAMLIT_HOST_PORT:-8501}:8501"
    volumes:
      # Settings, read-only. The container composes its own copy at start rather
      # than writing here, because the database is not where a host sees it.
      - ./.env:/app/host.env:ro

volumes:
  pgdata:
    name: supernatural-expert-pgdata
