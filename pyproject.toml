[project]
name = "supernatural-expert"
version = "0.1.0"
description = "Spoiler-safe question answering over Supernatural seasons 1 to 6."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joan Pareja", email = "jparegar9@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "dlt[postgres]>=1.29.1",
    "huggingface-hub>=1.24.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "pydantic-ai-slim[openai]>=2.27.0",
    "python-dotenv>=1.2.2",
    "semantic-text-splitter>=0.32.0",
    "tokenizers>=0.23.1",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
# Keep tool caches out of the repository root.
cache-dir = ".cache/ruff"

[tool.ruff.lint]
# E4/E7/E9: high-signal pycodestyle errors; F: Pyflakes correctness checks;
# I: import sorting. Keep this small so Ruff stays useful without becoming noisy.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# Directory-based so new files are checked without editing this list.
include = ["src", "tests"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
